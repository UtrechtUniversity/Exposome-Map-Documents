<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<head>
  <meta charset="UTF-8">
  <title>Exposome Maps Inventory</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 2rem;
      background-color: #fafafa;
    }

    h1 {
      margin-bottom: 1rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background-color: white;
      font-size: 0.9rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background-color: #f2f2f2;
      font-weight: 600;
      text-align: left;
      border-bottom: 2px solid #ccc;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      vertical-align: top;
      max-width: 320px;
      word-wrap: break-word;
    }

    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tbody tr:hover {
      background-color: #eef5ff;
    }
  </style>
</head>
<body>
  <h1>Exposome Maps Inventory</h1>
  <h3>Summary of the Exposome Maps inventory. Visit <a href="https://exposome.uu.nl/">exposome.uu.nl</a> for more visualization and more information.</h3>

  <table id="csv-table"></table>

  <script>

  async function loadCSV() {
    const response = await fetch('Exposome maps inventory.csv');
    const text = await response.text();

    const parsed = Papa.parse(text, {
      header: true,
      skipEmptyLines: true
    });

    const data = parsed.data;

    const table = document.getElementById('csv-table');

    const visibleHeaders = [
      'Surface ID',
      'Title',
      'Category',
      'Theme',
      'Summary',
      'Spatial_representation_type',
      'File type',
      'start_time',
      'end_time',
      'Time period',
      'Temporal resolution',
      'Frequency',
      'Spatial resolution',
      'Extent',
      'Owner',
      'Unit',
      'CRS',
      'available',
      'No-data value',
      'Comments',
      'References'
    ];

    // Header row
    const headerRow = document.createElement('tr');

    visibleHeaders.forEach(header => {
      const th = document.createElement('th');
      th.textContent = header;
      headerRow.appendChild(th);
    });

    table.appendChild(headerRow);

    // Data rows
    data.forEach(row => {
      const tr = document.createElement('tr');

      visibleHeaders.forEach(header => {
        const td = document.createElement('td');
        td.textContent = row[header] || '';
        tr.appendChild(td);
      });

      table.appendChild(tr);
    });
  }

  loadCSV();

  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exposome Maps Inventory</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 2rem;
      background-color: #fafafa;
    }

    h1 {
      margin-bottom: 1rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background-color: white;
      font-size: 0.9rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background-color: #f2f2f2;
      font-weight: 600;
      text-align: left;
      border-bottom: 2px solid #ccc;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      vertical-align: top;
      max-width: 320px;
      word-wrap: break-word;
    }

    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tbody tr:hover {
      background-color: #eef5ff;
    }
  </style>
</head>
<body>
  <h1>Exposome Maps Inventory</h1>
  <table id="csv-table"></table>

  <script>

    async function loadCSV() {
      const response = await fetch('Exposome maps inventory.csv');
      const text = await response.text();
      const rows = text.split('\n').filter(r => r.trim() !== '');

      const table = document.getElementById('csv-table');
      const visibleHeaders = [
        'Surface ID',
        'Title',
        'Category', 
        'Theme', 
        'Summary', 
        'Spatial_representation_type', 
        'File type', 'start_time', 'end_time', 
        'Time period', 
        'Temporal resolution', 
        'Frequency', 
        'Spatial resolution',
        'Extent', 
        'Owner', 
        'Unit', 
        'CRS', 
        'No-data value', 
        'available', 
        'Comments',
        'References'
      ];

  const columnWidths = {
    'Surface Number': '140px',
    'Title': '300px',
    'Category': '180px',
    'Theme': '220px',
    'Summary': '600px',
    'Spatial_representation_type': '260px',
    'File type': '160px',
    'start_time': '140px',
    'end_time': '140px',
    'Time period': '180px',
    'Temporal resolution': '200px',
    'Frequency': '160px',
    'Spatial resolution': '200px',
    'Extent': '420px',
    'Owner': '200px',
    'Unit': '160px',
    'CRS': '180px',
    'No-data value': '160px',
    'available_years': '200px',
    'Comments': '600px'
  };

      const headerCols = rows[0].split(';');
      const visibleIndexes = visibleHeaders.map(h => {
        const idx = headerCols.indexOf(h);
        if (idx === -1) {
          throw new Error(`Column not found in CSV header: ${h}`);
        }
        return idx;
      });

      rows.forEach((row, i) => {
        const tr = document.createElement('tr');
        const cols = row.split(';');

        visibleIndexes.forEach(index => {
          const cell = document.createElement(i === 0 ? 'th' : 'td');
          cell.textContent = cols[index] ?? '';
          tr.appendChild(cell);
        });
        table.appendChild(tr);
      });
    }


    
    loadCSV();

  </script>
</body>
</html>

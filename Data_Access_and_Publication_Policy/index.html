<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exposome-NL Data Platform Data Access and Publication Policy</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #64748b;
      --line: #cbd5e1;
      --paper: #ffffff;
      --page: #f4f7f8;
      --accent: #005b96;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    main {
      width: calc(100% - 2rem);
      max-width: 1500px;
      margin: 0 auto;
      padding: 1.5rem 0 3rem;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.75rem, 3vw, 2.5rem);
    }

    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .download-button {
      display: inline-block;
      min-width: 210px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .download-button:hover,
    .download-button:focus-visible {
      background: #004b78;
    }

    .pdf-preview {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 90vh;
      min-height: 600px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    @media (max-width: 600px) {
      main { width: calc(100% - 1rem); }
      .downloads { flex-direction: column; }
      .download-button { width: 100%; }
      .pdf-preview { height: 70vh; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Exposome-NL Data Platform Data Access and Publication Policy</h1>

    <div class="downloads" aria-label="Download the policy">
      <a class="download-button" href="Exposome_NL_Data_Access_and_Publication_Policy.docx" download>
        Download Word document
      </a>
      <a class="download-button" href="Exposome_NL_Data_Access_and_Publication_Policy.pdf" download>
        Download PDF
      </a>
    </div>

    <iframe class="pdf-preview" title="Exposome-NL Data Platform data access and publication policy preview" src="Exposome_NL_Data_Access_and_Publication_Policy.pdf#view=FitH"></iframe>
  </main>
</body>
</html>
